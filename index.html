<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse sua conta do Arquivo Investigativo.">
  <meta name="theme-color" content="#4E0A0B">
  <title>Entrar | Arquivo Investigativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css?v=6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <main class="access-page">
    <header class="brand-header">
      <a class="brand" href="./" aria-label="Arquivo Investigativo, página inicial">
        <img src="./icons/icon-192.png" alt="" class="brand-icon">
        <span>Arquivo<br>Investigativo</span>
      </a>
    </header>

    <section class="access-layout" aria-label="Acesso ao Arquivo Investigativo">
      <div class="visual-panel" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="shape shape-blue"></div>
        <div class="shape shape-pink"></div>
        <div class="shape shape-butter"></div>
        <div class="illustration-card illustration-book">
          <img src="./icons/icon-192.png" alt="">
        </div>
        <div class="mini-note note-yellow"><span class="note-star">✳</span><span class="note-line"></span><span class="note-line short"></span><span class="note-line"></span></div>
        <div class="mini-note note-pink"><span class="note-line"></span><span class="note-line short"></span><span class="note-line"></span></div>
        <span class="spark spark-one">✳</span>
        <span class="spark spark-two">✦</span>
        <span class="spark spark-three">✳</span>
        <div class="decorative-tag">ARQUIVO Nº 001</div>
      </div>

      <section class="form-panel">
        <div class="form-topline"><span class="topline-dot"></span><span id="form-kicker">ÁREA PESSOAL</span></div>
        <div id="auth-forms">
          <div class="form-heading">
            <h1 id="form-title">Entrar</h1>
            <p id="form-description">Acesse sua conta.</p>
          </div>

          <form id="form-login" class="auth-form">
            <label for="login-email">E-mail</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>

            <div class="label-row">
              <label for="login-senha">Senha</label>
              <button class="text-button" id="btn-recuperar" type="button">Esqueci minha senha</button>
            </div>
            <div class="password-wrap">
              <input id="login-senha" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
              <button class="password-toggle" type="button" data-target="login-senha" aria-label="Mostrar senha" aria-pressed="false"><span class="eye-icon">◉</span></button>
            </div>

            <button class="primary-button" type="submit">Entrar <span aria-hidden="true">↗</span></button>
            <p class="switch-prompt">Ainda não tem uma conta? <button class="text-button" id="btn-ir-cadastro" type="button">Criar conta</button></p>
          </form>

          <form id="form-cadastro" class="auth-form" hidden>
            <label for="cadastro-email">E-mail</label>
            <input id="cadastro-email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>

            <label for="cadastro-senha">Criar senha</label>
            <div class="password-wrap">
              <input id="cadastro-senha" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required>
              <button class="password-toggle" type="button" data-target="cadastro-senha" aria-label="Mostrar senha" aria-pressed="false"><span class="eye-icon">◉</span></button>
            </div>

            <button class="primary-button" type="submit">Criar conta <span aria-hidden="true">↗</span></button>
            <p class="switch-prompt">Já tem uma conta? <button class="text-button" id="btn-ir-login" type="button">Entrar</button></p>
          </form>
        </div>

        <div id="account-state" hidden>
          <div class="form-heading">
            <h1>Minha conta</h1>
            <p id="estado-conta"></p>
          </div>
          <button class="primary-button" id="btn-sair" type="button">Sair da conta</button>
        </div>
        <p id="mensagem-conta" class="status-message" role="status" aria-live="polite"></p>
        <div class="form-footer"><span class="footer-mark">✳</span><span>ARQUIVO INVESTIGATIVO</span></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
